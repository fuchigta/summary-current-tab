name: mutation

# StrykerJS でミュータントを作り、テストが見逃したものが増えていないかを確かめる。
# 設定は stryker.config.mjs、合否は scripts/check-mutation.mjs にある。
#
# - 版: @stryker-mutator/core・vitest-runner 10.1.1（package.json で固定）、pnpm 9.15.9、Node 24
# - 対象: src/lib/summarize.ts と src/background.ts の全体。popup.tsx・options.tsx（React の UI）は
#   対象外（理由は stryker.config.mjs）
# - 差分実行・incremental は使わない。全件でも 69 件・手元 約 90 秒で、incremental は
#   変異対象とテスト以外の変更（依存の更新など）を検出せず（Stryker 公式ドキュメント）、
#   CI ではレポートをキャッシュで引き継ぐ仕組みも要るため
# - 実測（2026-11-28、導入時）: 生成 69 件（summarize.ts 56・background.ts 13、うち等価として
#   除外 2 件）、Killed 59・Survived 8・NoCoverage 0、スコア 88.06%。3 回の全件実行で
#   ミュータントごとの結果まで一致。手元の Stryker 84〜89 秒
# - 実測（2026-11-28、穴埋め後）: 生成 69 件（等価として除外 2 件は変わらず）、Killed 67・
#   Survived 0・NoCoverage 0、スコア 100%。3 回の全件実行でミュータントごとの結果まで一致。
#   手元の Stryker 71〜75 秒
# - ゲート: 見逃し（Survived + NoCoverage）の上限を実測に置くラチェット。導入時 8 → 穴埋め後 0。
#   等価は除外済みなので余裕は持たせない。新しい等価ミュータントは上限ではなく除外コメントで扱う
# - 終了コード 0 だけでは空振り（変異対象 0 件）を見分けられないので、チェックスクリプトは
#   試されたミュータントが 1 件以上あり、mutate の各ファイルにミュータントがあることも確かめる
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 最初のテスト実行（dry run）でテストが 1 件でも落ちると Stryker は失敗する
      - name: Mutation testing
        run: pnpm test:mutation

      - name: Check undetected mutants
        run: node scripts/check-mutation.mjs

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
